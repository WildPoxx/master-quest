# ---------------------------------------------------------------------------
# MasterQuest — beta compatível com Foundry VTT 13.351
#
# A linha V13 vive na branch codex/compat-v13 e recebe tags com o sufixo
# -v13.N, por exemplo v0.30.3-v13.0. Ela nunca publica em releases/latest:
# o manifest estável dessa geração aponta diretamente para a branch de suporte.
# ---------------------------------------------------------------------------
name: Release V13 Beta

on:
  push:
    tags:
      - "v*-v13.*"

permissions:
  contents: write

jobs:
  release-v13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"

      - name: Testes V13
        run: npm run test:ci

      - name: Conferir se a tag bate com o module.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(jq -r .version module.json)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG != module.json version $VERSION — suba a versao antes de taggear."
            exit 1
          fi

      - name: Sincronizar download URL com a tag V13
        run: |
          jq --arg tag "$GITHUB_REF_NAME" \
            '.download = "https://github.com/WildPoxx/master-quest/releases/download/\($tag)/master-quest-v13.zip"' \
            module.json > module.json.tmp && mv module.json.tmp module.json

      - name: Empacotar master-quest-v13.zip
        run: |
          mkdir -p /tmp/pkg/master-quest
          cp -r module.json README.md LICENSE data scripts src styles templates /tmp/pkg/master-quest/
          cd /tmp/pkg && zip -rq "$GITHUB_WORKSPACE/master-quest-v13.zip" master-quest

      - name: Publicar pre-release V13
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: MasterQuest ${{ github.ref_name }} — Foundry V13 beta
          files: |
            master-quest-v13.zip
            module.json
          generate_release_notes: true
